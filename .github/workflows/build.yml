name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        shell: bash
        run: |
          chmod +x ./gradlew
          set +e
          for i in 1 2 3 4; do ./gradlew help -q && break; echo 'dependency download failed, retrying'; sleep 20; done
          ./gradlew build --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E -A4 'error:|What went wrong|Caused by|FAILURE' build.log | head -120 > err.txt
            split -b 3500 err.txt errpart.
            for part in errpart.*; do
              body=$(python3 -c "import sys;d=open(sys.argv[1]).read();print(d.replace('%','%25').replace('\r','').replace('\n','%0A'))" "$part")
              echo "::error title=build-$part::$body"
            done
            exit 1
          fi
      - name: upload jar
        uses: actions/upload-artifact@v7
        with:
          name: SvregSky-jar
          path: build/libs/*.jar
      - name: publish as the 'latest' release (easy download from a phone)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$JAR" --title "SvregSky (latest build)" --notes "Built from ${GITHUB_SHA::7}. Put the .jar in your mods folder (Fabric, Minecraft 26.2). Needs Fabric API." --prerelease

  screenshots:
    # Runs Minecraft with the mod under a virtual display and publishes sky screenshots to the ci-screens branch.
    if: ${{ contains(github.event.head_commit.message, '[shots]') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri
      - name: run client game test
        shell: bash
        run: |
          chmod +x ./gradlew
          set +e
          for i in 1 2 3 4; do ./gradlew help -q && break; echo 'dependency download failed, retrying'; sleep 20; done
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --stacktrace 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          { grep -E 'SvregSky:' test.log; echo '-----'; grep -E -B2 -A6 'ERROR|Exception|FAILED|crash' test.log | grep -v 'DEBUG' | head -120; } > notes.txt
          split -b 3500 notes.txt notepart.
          for part in notepart.*; do
            body=$(python3 -c "import sys;d=open(sys.argv[1]).read();print(d.replace('%','%25').replace('\r','').replace('\n','%0A'))" "$part")
            echo "::warning title=test-$part::$body"
          done
          echo "status=$status" >> $GITHUB_ENV
      - name: publish screenshots
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/shots
          find . -path ./.git -prune -o -name '*.png' -path '*screenshots*' -print | xargs -r -I{} cp {} /tmp/shots/
          find . -name 'crash-*.txt' -print | xargs -r -I{} cp {} /tmp/shots/ || true
          cp test.log /tmp/shots/test.log || true
          ls -la /tmp/shots
          echo "run $GITHUB_RUN_ID status $status" > /tmp/shots/RUN.txt
          cd /tmp/shots
          git init -q -b ci-screens
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "screenshots $GITHUB_RUN_ID"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens

  probe:
    # Prints the vanilla source of the classes the mod hooks into, so the code can match 26.2 exactly.
    if: ${{ contains(github.event.head_commit.message, '[probe]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: decompile minecraft
        run: chmod +x ./gradlew && ./gradlew genSources --stacktrace
      - name: extract
        run: |
          SRC=$(find ~/.gradle "$GITHUB_WORKSPACE/.gradle" -name '*sources*.jar' 2>/dev/null | grep -i minecraft | grep -v -i fabric-api | head -1)
          JAR=$(find ~/.gradle "$GITHUB_WORKSPACE/.gradle" -name '*.jar' 2>/dev/null | grep -i minecraft | grep -v -i -E 'sources|fabric-api|loader' | xargs -I{} sh -c 'unzip -l {} 2>/dev/null | grep -q dynamictransforms.glsl && echo {}' | head -1)
          mkdir -p probe x
          set +e
          unzip -o -q "$SRC" 'net/minecraft/*' 'com/mojang/*' -d src2
          M=src2/net/minecraft
          { ls src2/com/mojang/blaze3d/opengl/; grep -n -E 'public .*\(' src2/com/mojang/blaze3d/opengl/GlTexture.java | head -20; } > probe/a.txt
          { grep -rn -E 'glBindSampler|glSamplerParameter|_texParameter|glTexParameter' src2/com/mojang/blaze3d/opengl/*.java | head -30; } > probe/b.txt
          { grep -n -B3 -A25 'createTexture' src2/com/mojang/blaze3d/opengl/GlBackend.java src2/com/mojang/blaze3d/opengl/GlDevice.java 2>/dev/null | grep -E 'texParameter|TexParameter|9729|9728|33085|10241|10240|34892' | head -20; } > probe/c.txt
          { grep -n -E 'public static void _bindTexture|public static void _activeTexture|public static int _getActiveTexture|_texParameter' src2/com/mojang/blaze3d/opengl/GlStateManager.java | head; } > probe/d.txt
          for f in a b c d; do split -b 3500 probe/$f.txt probe/$f.part.; done
          ls probe
      - name: report 1
        run: |
          for part in $(ls probe/a.part.* probe/b.part.* 2>/dev/null | head -20); do
            body=$(python3 -c "import sys;d=open(sys.argv[1]).read();print(d.replace('%','%25').replace('\r','').replace('\n','%0A'))" "$part")
            echo "::notice title=probe-$(basename $part)::$body"
          done
      - name: report 2
        run: |
          for part in $(ls probe/c.part.* probe/d.part.* 2>/dev/null | head -20); do
            body=$(python3 -c "import sys;d=open(sys.argv[1]).read();print(d.replace('%','%25').replace('\r','').replace('\n','%0A'))" "$part")
            echo "::notice title=probe-$(basename $part)::$body"
          done
