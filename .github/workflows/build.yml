name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        shell: bash
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew build --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E -A4 'error:|What went wrong|Caused by|FAILURE' build.log | head -120 > err.txt
            split -b 3500 err.txt errpart.
            for part in errpart.*; do
              body=$(python3 -c "import sys;d=open(sys.argv[1]).read();print(d.replace('%','%25').replace('\r','').replace('\n','%0A'))" "$part")
              echo "::error title=build-$part::$body"
            done
            exit 1
          fi
      - name: upload jar
        uses: actions/upload-artifact@v7
        with:
          name: SvregSky-jar
          path: build/libs/*.jar
      - name: publish as the 'latest' release (easy download from a phone)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$JAR" --title "SvregSky (latest build)" --notes "Built from ${GITHUB_SHA::7}. Put the .jar in your mods folder (Fabric, Minecraft 26.2). Needs Fabric API." --prerelease

  screenshots:
    # Runs Minecraft with the mod under a virtual display and publishes sky screenshots to the ci-screens branch.
    if: ${{ contains(github.event.head_commit.message, '[shots]') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri
      - name: run client game test
        shell: bash
        run: |
          chmod +x ./gradlew
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --stacktrace 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          { grep -E 'SvregSky:' test.log; echo '-----'; grep -E -B2 -A6 'ERROR|Exception|FAILED|crash' test.log | grep -v 'DEBUG' | head -120; } > notes.txt
          split -b 3500 notes.txt notepart.
          for part in notepart.*; do
            body=$(python3 -c "import sys;d=open(sys.argv[1]).read();print(d.replace('%','%25').replace('\r','').replace('\n','%0A'))" "$part")
            echo "::warning title=test-$part::$body"
          done
          echo "status=$status" >> $GITHUB_ENV
      - name: publish screenshots
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/shots
          find . -path ./.git -prune -o -name '*.png' -path '*screenshots*' -print | xargs -r -I{} cp {} /tmp/shots/
          find . -name 'crash-*.txt' -print | xargs -r -I{} cp {} /tmp/shots/ || true
          cp test.log /tmp/shots/test.log || true
          ls -la /tmp/shots
          echo "run $GITHUB_RUN_ID status $status" > /tmp/shots/RUN.txt
          cd /tmp/shots
          git init -q -b ci-screens
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "screenshots $GITHUB_RUN_ID"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens

  probe:
    # Prints the vanilla source of the classes the mod hooks into, so the code can match 26.2 exactly.
    if: ${{ contains(github.event.head_commit.message, '[probe]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: decompile minecraft
        run: chmod +x ./gradlew && ./gradlew genSources --stacktrace
      - name: extract
        run: |
          SRC=$(find ~/.gradle "$GITHUB_WORKSPACE/.gradle" -name '*sources*.jar' 2>/dev/null | grep -i minecraft | grep -v -i fabric-api | head -1)
          JAR=$(find ~/.gradle "$GITHUB_WORKSPACE/.gradle" -name '*.jar' 2>/dev/null | grep -i minecraft | grep -v -i -E 'sources|fabric-api|loader' | xargs -I{} sh -c 'unzip -l {} 2>/dev/null | grep -q dynamictransforms.glsl && echo {}' | head -1)
          mkdir -p probe x
          unzip -o -q "$SRC" 'net/minecraft/*' 'com/mojang/*' -d src2
          M=src2/net/minecraft
          { grep -n -E 'coldEnoughToSnow|getPrecipitationAt|public boolean warmEnoughToRain' $M/world/level/biome/Biome.java;
            grep -n -E 'IS_OCEAN|IS_BEACH|IS_RIVER|IS_FOREST|IS_MOUNTAIN|HAS_' $M/tags/BiomeTags.java | head -12;
            grep -n -E 'public float getThunderLevel|public float getRainLevel|public boolean isThundering|getEntities\(|public int getBrightness|getSeaLevel' $M/world/level/Level.java $M/world/level/BlockAndTintGetter.java $M/world/level/LevelReader.java $M/world/level/EntityGetter.java | head -12;
            grep -rn -E 'public static final EntityType<[A-Za-z]+> VILLAGER' $M/world/entity/EntityType.java;
            grep -n -E 'hideGui' $M/client/Options.java | head -3;
          } > probe/a.txt
          { grep -n -E 'public .*getSingleplayerServer|public .*getCurrentServer|public int getFps|public .*isLocalServer' $M/client/Minecraft.java;
            grep -rn -E 'public String getLevelName|String levelName' $M/world/level/storage/WorldData.java $M/world/level/storage/PrimaryLevelData.java | head -4;
            grep -n -E 'public String ip|public final String ip|String ip;' $M/client/multiplayer/ServerData.java | head -3;
            grep -n -E 'getWorldData|public .*storageSource|getWorldPath' $M/server/MinecraftServer.java | head -5;
            grep -n -E 'private void render(Sun|Moon)\(|MoonPhase' $M/client/renderer/SkyRenderer.java | head -6;
            grep -n -E '^[A-Z_]+\(|public int|index' $M/world/level/MoonPhase.java | head -12;
          } > probe/b.txt
          { grep -n -E 'public static final BlendFunction [A-Z_]+' src2/com/mojang/blaze3d/pipeline/BlendFunction.java;
            grep -n -E 'USAGE_[A-Z_]+|createTexture\(' src2/com/mojang/blaze3d/pipeline/RenderTarget.java | head -8;
            grep -n -E 'class CameraRenderState|public .* entityRenderState' $M/client/renderer/state/level/CameraRenderState.java | head -4;
            grep -rn -E 'backwardsInterpolatedWalkDistance;|public float bob;' $M/client/renderer/state | head -4;
            grep -n -E 'IMPERMEABLE|GLASS' $M/tags/BlockTags.java | head -4;
            grep -n -E 'public static Button.Builder builder|public static final' $M/client/gui/components/Button.java | head -4;
          } > probe/c.txt
          { grep -n -E 'LIT|CampfireBlock' $M/world/level/block/CampfireBlock.java | head -3;
            grep -n -E 'public static final BooleanProperty LIT' $M/world/level/block/state/properties/BlockStateProperties.java;
            grep -rn -E 'enum LightLayer' $M/world/level/LightLayer.java;
            grep -n -E 'public .* getBiome\(' $M/world/level/LevelReader.java $M/world/level/biome/BiomeManager.java | head -3;
          } > probe/d.txt
          for f in a b c d; do split -b 3500 probe/$f.txt probe/$f.part.; done
          ls probe
      - name: report 1
        run: |
          for part in $(ls probe/a.part.* probe/b.part.* 2>/dev/null | head -10); do
            body=$(python3 -c "import sys;d=open(sys.argv[1]).read();print(d.replace('%','%25').replace('\r','').replace('\n','%0A'))" "$part")
            echo "::notice title=probe-$(basename $part)::$body"
          done
      - name: report 2
        run: |
          for part in $(ls probe/c.part.* probe/d.part.* 2>/dev/null | head -20); do
            body=$(python3 -c "import sys;d=open(sys.argv[1]).read();print(d.replace('%','%25').replace('\r','').replace('\n','%0A'))" "$part")
            echo "::notice title=probe-$(basename $part)::$body"
          done
