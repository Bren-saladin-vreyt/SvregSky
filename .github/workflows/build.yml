name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        shell: bash
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew build --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E -A4 'error:|What went wrong|Caused by|FAILURE' build.log | head -120 > err.txt
            split -b 3500 err.txt errpart.
            for part in errpart.*; do
              body=$(python3 -c "import sys;d=open(sys.argv[1]).read();print(d.replace('%','%25').replace('\r','').replace('\n','%0A'))" "$part")
              echo "::error title=build-$part::$body"
            done
            exit 1
          fi
      - name: upload jar
        uses: actions/upload-artifact@v7
        with:
          name: SvregSky-jar
          path: build/libs/*.jar

  screenshots:
    # Runs Minecraft with the mod under a virtual display and publishes sky screenshots to the ci-screens branch.
    if: ${{ contains(github.event.head_commit.message, '[shots]') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri
      - name: run client game test
        shell: bash
        run: |
          chmod +x ./gradlew
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --stacktrace 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          grep -E -B2 -A6 'ERROR|Exception|Mixin|svregsky|SvregSky|FAILED|crash' test.log | grep -v 'DEBUG' | head -150 > notes.txt
          split -b 3500 notes.txt notepart.
          for part in notepart.*; do
            body=$(python3 -c "import sys;d=open(sys.argv[1]).read();print(d.replace('%','%25').replace('\r','').replace('\n','%0A'))" "$part")
            echo "::warning title=test-$part::$body"
          done
          echo "status=$status" >> $GITHUB_ENV
      - name: publish screenshots
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/shots
          find . -path ./.git -prune -o -name '*.png' -path '*screenshots*' -print | xargs -r -I{} cp {} /tmp/shots/
          find . -name 'crash-*.txt' -print | xargs -r -I{} cp {} /tmp/shots/ || true
          ls -la /tmp/shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin ci-screens || true
          git switch --orphan ci-screens-new
          git rm -rq . || true
          cp /tmp/shots/* . 2>/dev/null || true
          echo "run $GITHUB_RUN_ID status $status" > RUN.txt
          git add -A
          git commit -qm "screenshots $GITHUB_RUN_ID"
          git push -f origin ci-screens-new:ci-screens

  probe:
    # Prints the vanilla source of the classes the mod hooks into, so the code can match 26.2 exactly.
    if: ${{ contains(github.event.head_commit.message, '[probe]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: decompile minecraft
        run: chmod +x ./gradlew && ./gradlew genSources --stacktrace
      - name: report signatures as annotations
        run: |
          SRC=$(find ~/.gradle "$GITHUB_WORKSPACE/.gradle" -name '*sources*.jar' 2>/dev/null | grep -i minecraft | grep -v -i fabric-api | head -1)
          mkdir -p probe
          unzip -p "$SRC" net/minecraft/client/renderer/CloudRenderer.java > probe/cloud.java
          unzip -p "$SRC" net/minecraft/client/renderer/LevelRenderer.java > probe/level.java
          unzip -p "$SRC" net/minecraft/client/renderer/RenderPipelines.java > probe/pipes.java
          # declarations of CloudRenderer
          grep -n -E '^\s*(public|private|protected|static|final|record|class|enum|interface|@)' probe/cloud.java > probe/a.txt || true
          # cell encoding helpers and texture loading (bodies needed to build our own cloud maps)
          awk '/loadTexture|packCellData|isNorthEmpty|TextureData|prepare\(|apply\(|public void render|markForRebuild|endFrame|close\(/{p=1} p{print NR": "$0} /^    }/{p=0}' probe/cloud.java | head -260 > probe/b.txt || true
          # how LevelRenderer drives the cloud renderer
          grep -n -i -B4 -A10 'cloudRenderer\|addCloudsPass\|CloudStatus' probe/level.java | head -220 > probe/c.txt || true
          grep -n -i -A10 'CLOUDS' probe/pipes.java | head -40 > probe/d.txt || true
          for f in a b c d; do
            split -b 30000 probe/$f.txt probe/$f.part.
            for part in probe/$f.part.*; do
              body=$(python3 -c "import sys,urllib.parse;d=open(sys.argv[1]).read();print(d.replace('%','%25').replace('\r','').replace('\n','%0A'))" "$part")
              echo "::notice title=probe-$(basename $part)::$body"
            done
          done
